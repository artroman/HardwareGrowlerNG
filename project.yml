name: HardwareGrowlerNG

options:
  bundleIdPrefix: com.growl
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.0"
    CURRENT_PROJECT_VERSION: "1"
    # The ported monitors are all manual-retain-release Objective-C.
    CLANG_ENABLE_OBJC_ARC: NO
    # The monitors lean on 2012-era AppKit/IOKit symbols that are deprecated
    # (but still present). Keep the build quiet so real errors stand out.
    GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS: NO
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: NO
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    ONLY_ACTIVE_ARCH: "$(inherited)"

targets:
  HardwareGrowlerNG:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.growl.HardwareGrowler
        # Distinct from the legacy /Applications/HardwareGrowler.app during dev.
        PRODUCT_NAME: HardwareGrowlerNG
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/HardwareGrowlerNG.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PluginKit/HardwareGrowlerNG-Bridging-Header.h
        GCC_PREFIX_HEADER: Sources/PluginKit/HWGCompat.pch
        # Sign with a stable identity, not ad-hoc. UNUserNotificationCenter keys
        # authorization off the app's designated requirement; ad-hoc re-signs
        # every build, so macOS kept marking the "new" app as denied.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: XNAZEWFH6C
        PROVISIONING_PROFILE_SPECIFIER: ""
        OTHER_CODE_SIGN_FLAGS: "--options runtime"
        MARKETING_VERSION: "3.0"
        # arm64 first; a Release build produces a universal (arm64 + x86_64) binary.
        ARCHS: "$(ARCHS_STANDARD)"
    dependencies:
      - sdk: IOKit.framework
      - sdk: IOBluetooth.framework
      - sdk: SystemConfiguration.framework
      - sdk: DiskArbitration.framework
      - sdk: UserNotifications.framework
      - sdk: ServiceManagement.framework
      - sdk: CoreWLAN.framework
